name: MTA Ad-free Multi-engine Validation (patch compatibility fix)

on:
  workflow_dispatch:
  push:
    branches: [feature/multi-engine-adfree]
    paths:
      - 'project-overlay/**'
      - 'tools/apply_adfree_redesign.py'
      - 'tools/patch_media_engine.py'
      - 'tools/patch_runtime_stack.py'
      - 'tools/audit_sbom.py'
      - 'tools/inspect_embedded_python.py'
      - 'tools/test_inspect_embedded_python.py'
      - 'tools/package_corresponding_source.sh'
      - 'tools/package_python_sources.py'
      - 'tools/cyclonedx.init.gradle.kts'
      - 'THIRD-PARTY-NOTICES.md'
      - 'docs/**'
      - '.github/workflows/android-multi-engine-check.yml'

concurrency:
  group: mta-multi-engine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36.1" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Extract and apply reviewed source changes
        run: |
          set -euo pipefail
          mkdir project
          unzip -q mta-downloader-nov-17-2026-10-15-48-pm.zip -d project
          cp -a project-overlay/. project/
          echo '--- SOURCE INVENTORY ---'
          find project/app/src/main/java/com/example/data -maxdepth 4 -type f | sort | head -120
          echo '--- EXTRACTOR SOURCES ---'
          find project/app/src/main/java/com/example/data/extractor -maxdepth 2 -type f -name '*.kt' -print -exec sed -n '1,260p' {} \;
          echo '--- GRADLE CATALOG ---'
          sed -n '1,240p' project/gradle/libs.versions.toml
          echo '--- DOWNLOAD UI AND VIEWMODEL FILES ---'
          find project/app/src/main/java/com/example -maxdepth 7 -type f | sort | grep -Ei 'download|viewmodel|screen' | head -200 || true
          echo '--- DOWNLOAD FLOW REFERENCES ---'
          grep -RInE 'enqueueDownload|deleteDownload|syncActiveDownloadsProgress|pauseDownload|resumeDownload' project/app/src/main/java/com/example | head -240 || true
          echo '--- VIDEO AND DOWNLOAD MODELS ---'
          sed -n '1,260p' project/app/src/main/java/com/example/data/model/VideoModels.kt
          sed -n '1,240p' project/app/src/main/java/com/example/data/local/DownloadEntity.kt
          python3 tools/patch_media_engine.py project/app/src/main/java/com/example/data/extractor/MediaExtractorEngine.kt
          python3 tools/patch_runtime_stack.py project
          python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Enforce ad-free source invariant
        run: |
          set -euo pipefail
          if grep -RInE 'StartApp|StartIo|Start\.io|210745939|AD_ID|com\.startapp|rewarded.?ad|onVideoCompleted' project/app/src/main project/app/build.gradle.kts; then
            echo "::error::Advertising SDK, identifier, or rewarded-ad flow remains in the assembled source."
            exit 1
          fi
          ! grep -q 'com.startapp:inapp-sdk' project/app/build.gradle.kts
          ! grep -q 'com.google.android.gms.permission.AD_ID' project/app/src/main/AndroidManifest.xml
          grep -q 'quality.audioStreamUrl' project/app/src/main/java/com/example/data/repository/DownloadRepository.kt
          grep -q 'mediaProcessingEngine.mergeFiles(video, audio, output)' project/app/src/main/java/com/example/data/repository/DownloadRepository.kt
          grep -q 'audioStreamUrl = bestAudioStream.content' project/app/src/main/java/com/example/data/extractor/NewPipeMediaProvider.kt
          test -s project/app/src/androidTest/java/com/example/data/media/MediaProcessingEngineInstrumentedTest.kt
      - name: Run unit tests and lint
        working-directory: project
        run: |
          gradle --no-daemon --no-configuration-cache testDebugUnitTest
          gradle --no-daemon --no-configuration-cache lint
      - name: Generate CycloneDX SBOM and dependency reports
        working-directory: project
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --init-script ../tools/cyclonedx.init.gradle.kts cyclonedxBom
          gradle --no-daemon --no-configuration-cache :app:dependencies --configuration debugRuntimeClasspath > app/build/reports/debugRuntimeClasspath-dependencies.txt
          gradle --no-daemon --no-configuration-cache :app:dependencyInsight --dependency yt-dlp-android --configuration debugRuntimeClasspath > app/build/reports/yt-dlp-android-dependency-insight.txt
          gradle --no-daemon --no-configuration-cache :app:dependencyInsight --dependency NewPipeExtractor --configuration debugRuntimeClasspath > app/build/reports/newpipe-dependency-insight.txt
          python3 ../tools/inspect_embedded_python.py --gradle-cache "$HOME/.gradle/caches" --output build/reports/embedded-python-packages.json
          mkdir -p app/src/main/assets/open-source-licenses
          # Ship the repository's complete third-party notice as a root-level APK asset.
          # The audit checks the packaged APK, not merely the source repository.
          test -s ../THIRD-PARTY-NOTICES.md
          cp ../THIRD-PARTY-NOTICES.md app/src/main/assets/THIRD-PARTY-NOTICES.txt
          cp build/reports/cyclonedx/bom.json app/src/main/assets/open-source-licenses/DEPENDENCY_SBOM.json
          cp build/reports/embedded-python-packages.json app/src/main/assets/open-source-licenses/EMBEDDED_PYTHON_PACKAGES.json
      - name: Build debug APK with embedded SBOM
        working-directory: project
        run: gradle --no-daemon --no-configuration-cache assembleDebug
      - name: Run real FFmpeg mux integration test on x86_64 Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            cd project
            gradle --no-daemon --no-configuration-cache connectedDebugAndroidTest
      - name: Audit SBOM, AAR and APK for licenses and FFmpeg
        working-directory: project
        run: |
          set -euo pipefail
          python3 ../tools/audit_sbom.py \
            --bom build/reports/cyclonedx/bom.json \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --gradle-cache "$HOME/.gradle/caches" \
            --output build/reports/THIRD_PARTY_LICENSE_AUDIT.md
      - name: Assemble GPL corresponding-source package
        run: |
          set -euo pipefail
          bash tools/package_corresponding_source.sh "$GITHUB_WORKSPACE/MTA-DOWNLOADER-CORRESPONDING-SOURCE.zip"
      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MTA-adfree-validation
          path: |
            project/app/build/outputs/apk/debug/*.apk
            project/app/build/reports/**
            project/build/reports/cyclonedx/**
            project/build/reports/cyclonedx-direct/**
            project/app/build/reports/cyclonedx-direct/**
            project/build/reports/THIRD_PARTY_LICENSE_AUDIT.md
            project/build/reports/embedded-python-packages.json
            MTA-DOWNLOADER-CORRESPONDING-SOURCE.zip
            project/app/build/test-results/**
            project/app/build/outputs/androidTest-results/**
            project/app/build/reports/androidTests/**
            project/app/src/main/**
            project/app/build.gradle.kts
          if-no-files-found: warn
          retention-days: 14
