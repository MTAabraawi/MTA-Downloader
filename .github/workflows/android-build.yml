name: Android Debug Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and inspect Gradle configuration
        run: |
          unzip -q mta-downloader-nov-17-2026-10-15-48-pm.zip -d project
          echo "===== WRAPPER PROPERTIES ====="
          cat project/gradle/wrapper/gradle-wrapper.properties
          echo "===== VERSION CATALOG ====="
          cat project/gradle/libs.versions.toml
          echo "===== ROOT BUILD ====="
          cat project/build.gradle.kts
          echo "===== APP BUILD ====="
          cat project/app/build.gradle.kts
          echo "===== SETTINGS ====="
          cat project/settings.gradle.kts
          echo "===== WRAPPER FILES ====="
          find project/gradle -maxdepth 3 -type f -print
