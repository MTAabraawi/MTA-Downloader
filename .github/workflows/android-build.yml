name: Android Debug Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36.1
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract Android project archive
        run: |
          unzip -q mta-downloader-nov-17-2026-10-15-48-pm.zip -d project
          echo "Gradle version: $(gradle --version | head -8 | tail -1)"
          echo "Android SDK: $ANDROID_HOME"

      - name: Prepare debug signing key
        working-directory: project
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Run unit tests
        working-directory: project
        run: gradle --no-daemon testDebugUnitTest

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MTA-Downloader-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
