name: Android Debug Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract Android project archive
        run: |
          unzip -q mta-downloader-nov-17-2026-10-15-48-pm.zip -d project
          echo "Project root contents:"
          find project -maxdepth 2 -type f | sort | head -100

      - name: Build debug APK
        working-directory: project
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          elif [ -f ./gradle/wrapper/gradle-wrapper.jar ]; then
            gradle --no-daemon assembleDebug
          else
            echo "Gradle wrapper not found; cannot safely infer Gradle version."
            exit 1
          fi

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MTA-Downloader-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
