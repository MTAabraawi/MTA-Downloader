name: Android Signed Release
on:
  workflow_dispatch:
  push:
    branches: [feature/multi-engine-adfree]
    paths:
      - 'project-overlay/**'
      - 'tools/patch_media_engine.py'
      - 'tools/patch_runtime_stack.py'
      - '.github/workflows/android-release.yml'
  pull_request:
    branches: [main, feature/multi-engine-adfree]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36.1" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Extract project and install signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::Missing STORE_PASSWORD repository secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing KEY_PASSWORD repository secret"; exit 1; }
          mkdir -p project
          unzip -q mta-downloader-nov-17-2026-10-15-48-pm.zip -d project
          cp -a project-overlay/. project/
          python3 tools/patch_media_engine.py project/app/src/main/java/com/example/data/extractor/MediaExtractorEngine.kt
          python3 tools/patch_runtime_stack.py project
          python3 -m unittest discover -s tools -p 'test_*.py' -v
          if grep -RInE 'StartApp|StartIo|Start\.io|210745939|AD_ID|com\.startapp|rewarded.?ad|RewardDownloadConfirmDialog|rewardDialogState|enqueueDownloadAfterReward' project/app/src/main project/app/build.gradle.kts; then
            echo "::error::Advertising code or SDK detected in release source"
            exit 1
          fi
          grep -q 'mediaProcessingEngine.mergeFiles(video, audio, output)' project/app/src/main/java/com/example/data/repository/DownloadRepository.kt
          # Normalize harmless whitespace/newlines, then strictly decode without printing the secret.
          python3 - <<'PY'
          import base64
          import os
          import re
          import sys
          encoded = re.sub(r"\s+", "", os.environ["KEYSTORE_BASE64"])
          # Accept both standard and URL-safe Base64, including omitted trailing padding.
          encoded = encoded.replace("-", "+").replace("_", "/")
          encoded += "=" * (-len(encoded) % 4)
          try:
              decoded = base64.b64decode(encoded, validate=True)
          except Exception:
              print("::error::KEYSTORE_BASE64 is malformed or truncated. Re-encode the original JKS file as Base64 and replace only this secret; do not paste the key or passwords into logs or chat.")
              sys.exit(1)
          if not decoded:
              print("::error::Decoded keystore is empty.")
              sys.exit(1)
          with open("project/my-upload-key.jks", "wb") as keystore:
              keystore.write(decoded)
          PY
          chmod 600 project/my-upload-key.jks
          test -s project/my-upload-key.jks
          # Confirm the decoded file is a readable keystore and contains the expected upload alias.
          keytool -list -keystore project/my-upload-key.jks -storepass "$STORE_PASSWORD" -alias upload >/dev/null
          # Verify the private-key password too, before spending time on Gradle/emulator builds.
          keytool -certreq -keystore project/my-upload-key.jks -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias upload -file "$RUNNER_TEMP/mta-upload-key-check.csr" >/dev/null
          rm -f "$RUNNER_TEMP/mta-upload-key-check.csr"
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/project/my-upload-key.jks" >> "$GITHUB_ENV"
      - name: Upload extracted source snapshot for code review
        uses: actions/upload-artifact@v4
        with:
          name: MTA-Downloader-extracted-source-review
          path: |
            project/app/src/main/**
            project/app/src/test/**
            project/app/build.gradle.kts
            project/gradle/libs.versions.toml
          if-no-files-found: error
          retention-days: 3
      - name: Run tests and build signed APK and AAB
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$STORE_PASSWORD" || { echo "::error::Missing STORE_PASSWORD repository secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing KEY_PASSWORD repository secret"; exit 1; }
          cd project
          gradle --no-daemon testDebugUnitTest
          gradle --no-daemon lint
          gradle --no-daemon assembleDebug
          gradle --no-daemon assembleRelease bundleRelease
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
      - name: Run on-device FFmpeg integration test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            cd "$GITHUB_WORKSPACE/project" && gradle --no-daemon --no-configuration-cache connectedDebugAndroidTest
      - name: Verify signatures and application identity
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail
          APK="project/app/build/outputs/apk/release/app-release.apk"
          AAB="project/app/build/outputs/bundle/release/app-release.aab"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature-verification.txt
          jarsigner -verify -verbose -certs "$AAB" > aab-signature-verification.txt
          keytool -printcert -jarfile "$AAB" > aab-certificate.txt
          keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias upload > keystore-certificate.txt
          "$AAPT" dump badging "$APK" | grep -m1 "^package:" | tee app-identity.txt
          grep -q "com.aistudio.mtadownloader.xktmqa" app-identity.txt
          sha256sum "$APK" "$AAB" | tee release-sha256.txt
      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MTA-Downloader-signed-release
          path: |
            project/app/build/outputs/apk/release/app-release.apk
            project/app/build/outputs/bundle/release/app-release.aab
            apk-signature-verification.txt
            aab-signature-verification.txt
            aab-certificate.txt
            keystore-certificate.txt
            app-identity.txt
            release-sha256.txt
          if-no-files-found: error
          retention-days: 30
