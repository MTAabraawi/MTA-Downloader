name: Android Project Review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-review.yml'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract and inventory project
        run: |
          mkdir -p project
          unzip -q mta-downloader-nov-17-2026-10-15-48-pm.zip -d project
          find project -maxdepth 5 -type f | sort > project-files.txt
          echo "## Project inventory" >> "$GITHUB_STEP_SUMMARY"
          echo 'File count: '$(wc -l < project-files.txt) >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,160p' project-files.txt >> "$GITHUB_STEP_SUMMARY"
          echo "## Build configuration" >> "$GITHUB_STEP_SUMMARY"
          find project -type f \( -name 'settings.gradle*' -o -name 'build.gradle*' -o -name 'gradle.properties' -o -name 'AndroidManifest.xml' \) -print
          echo "### app/build.gradle.kts" >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,240p' project/app/build.gradle.kts >> "$GITHUB_STEP_SUMMARY"
          cp project/app/build.gradle.kts app-build.gradle.kts
          cp project/app/src/main/AndroidManifest.xml app-AndroidManifest.xml
          cp project/gradle.properties project-gradle.properties
          cp project/gradle/libs.versions.toml project-libs.versions.toml

      - name: Static security and configuration review
        run: |
          cd project
          {
            echo "## Static review"
            echo '### Potential secret files'
            find . -type f \( -name '*.jks' -o -name '*.keystore' -o -name 'google-services.json' -o -name '*.p12' \) -print
            echo '### Manifest and permissions'
            find . -name AndroidManifest.xml -print
            grep -RInE 'uses-permission|uses-feature|android:exported|usesCleartextTraffic' --include='AndroidManifest.xml' . || true
            echo '### Network, downloader, storage, ads references'
            grep -RInE 'https?://|DownloadManager|MediaStore|ACTION_CREATE_DOCUMENT|MANAGE_EXTERNAL_STORAGE|READ_MEDIA|WRITE_EXTERNAL_STORAGE|start\.io|StartApp|AdView|WebView|CookieManager' --include='*.kt' --include='*.java' --include='*.xml' --include='*.gradle' --include='*.kts' . | head -n 500 || true
            echo '### TODO / FIXME'
            grep -RInE 'TODO|FIXME|XXX' --include='*.kt' --include='*.java' --include='*.xml' . | head -n 200 || true
          } | tee ../static-review.txt

      - name: Run tests, lint and release build
        run: |
          cd project
          set +e
          # Generate a disposable CI-only debug key required by this project configuration.
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          gradle --no-daemon tasks --all > ../gradle-tasks.txt 2>&1
          echo "TASKS_EXIT=$?" >> "$GITHUB_ENV"
          gradle --no-daemon testDebugUnitTest > ../unit-tests.log 2>&1
          echo "UNIT_TESTS_EXIT=$?" >> "$GITHUB_ENV"
          gradle --no-daemon lint > ../lint.log 2>&1
          echo "LINT_EXIT=$?" >> "$GITHUB_ENV"
          gradle --no-daemon assembleRelease > ../release-build.log 2>&1
          echo "RELEASE_BUILD_EXIT=$?" >> "$GITHUB_ENV"
          gradle --no-daemon assembleDebug > ../debug-build.log 2>&1
          echo "DEBUG_BUILD_EXIT=$?" >> "$GITHUB_ENV"
          exit 0

      - name: Summarize results and collect APK metadata
        if: always()
        run: |
          {
            echo "## Automated review results"
            echo "| Check | Exit code |"
            echo "|---|---:|"
            echo "| Gradle task discovery | ${TASKS_EXIT:-not-run} |"
            echo "| Unit tests | ${UNIT_TESTS_EXIT:-not-run} |"
            echo "| Android lint | ${LINT_EXIT:-not-run} |"
            echo "| Release build | ${RELEASE_BUILD_EXIT:-not-run} |"
            echo "| Debug build | ${DEBUG_BUILD_EXIT:-not-run} |"
            echo
            echo "Exit code 0 means the command completed successfully. Review lint reports and logs for warnings."
            echo
            echo "### APK outputs"
            find project -type f -path '*/build/outputs/apk/*/*.apk' -print 2>/dev/null || true
          } | tee review-summary.md
          cat review-summary.md >> "$GITHUB_STEP_SUMMARY"
          find project -type f \( -name '*.xml' -o -name '*.html' \) -path '*/reports/*' -print > report-files.txt || true

      - name: Upload review bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MTA-Downloader-review-results
          path: |
            project-files.txt
            app-build.gradle.kts
            app-AndroidManifest.xml
            project-gradle.properties
            project-libs.versions.toml
            static-review.txt
            gradle-tasks.txt
            unit-tests.log
            lint.log
            release-build.log
            debug-build.log
            review-summary.md
            report-files.txt
            project/**/build/reports/**
            project/**/build/outputs/apk/**
            project/**/src/**
            project/**/*.gradle
            project/**/*.gradle.kts
            project/**/*.toml
            project/**/*.properties
            project/**/AndroidManifest.xml
          if-no-files-found: warn
          retention-days: 14
